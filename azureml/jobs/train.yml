$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json
type: command
display_name: yolo-train
experiment_name: yolo-retraining
compute: azureml:yolo-gpu-cluster
code: ../..
environment:
  image: ultralytics/ultralytics@sha256:a178a2eb438450fe2e2378dd1db91a0bdb8a7b7c4281de0be6451f4e42f04c06
inputs:
  training_data:
    type: uri_folder
    path: azureml:yolo-training-data:1
    mode: download
  base_model: yolo11n.pt
  epochs: 50
  image_size: 640
  batch_size: 16
  device: "0"
outputs:
  model_output:
    type: uri_folder
    mode: upload
command: >-
  python src/train.py
  --data ${{inputs.training_data}}/data.yaml
  --model ${{inputs.base_model}}
  --epochs ${{inputs.epochs}}
  --image-size ${{inputs.image_size}}
  --batch-size ${{inputs.batch_size}}
  --device ${{inputs.device}}
  --model-output ${{outputs.model_output}}
limits:
  timeout: 21600