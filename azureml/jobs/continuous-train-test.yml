$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json
type: command
display_name: yolo-continuous-training-test
experiment_name: yolo-continuous-training-test
compute: azureml:yolo-batch-cpu
code: ../..
environment:
  image: ultralytics/ultralytics@sha256:6fe75a90a066a012916932db205dddba8069e8e213ec237e2e42569dbe2e5332
inputs:
  training_data:
    type: uri_folder
    path: azureml:yolo-training-data:1
    mode: download
  base_model: yolo11n.pt
  epochs: 2
  image_size: 320
  batch_size: 4
  device: cpu
outputs:
  model_output:
    type: uri_folder
    mode: upload
command: >-
  python src/train.py
  --data ${{inputs.training_data}}/data.yaml
  --model ${{inputs.base_model}}
  --epochs ${{inputs.epochs}}
  --image-size ${{inputs.image_size}}
  --batch-size ${{inputs.batch_size}}
  --device ${{inputs.device}}
  --model-output ${{outputs.model_output}}
limits:
  timeout: 7200