$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json
type: command
display_name: validate-yolo-data
experiment_name: yolo-data-validation
compute: azureml:yolo-batch-cpu
code: ../..
environment:
  image: ultralytics/ultralytics@sha256:6fe75a90a066a012916932db205dddba8069e8e213ec237e2e42569dbe2e5332
inputs:
  training_data:
    type: uri_folder
    path: azureml:yolo-training-data:1
    mode: download
command: >-
  python src/validate_dataset.py
  --data ${{inputs.training_data}}/data.yaml
limits:
  timeout: 1800